<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#050811" />
    </radialGradient>
    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="purple-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e879f9" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="6" />

  <!-- Background Ambient Glow -->
  <circle cx="256" cy="256" r="140" fill="#0284c7" opacity="0.15" filter="url(#glow)" />
  <circle cx="256" cy="256" r="80" fill="#a855f7" opacity="0.15" filter="url(#glow)" />

  <!-- DNA Double Helix Rungs and Strands -->
  <g filter="url(#glow)">
    <!-- Hydrogen bonds (Rungs) -->
    <line x1="180" y1="140" x2="332" y2="140" stroke="#38bdf8" stroke-width="5" stroke-dasharray="8 6" opacity="0.8" />
    <line x1="160" y1="180" x2="352" y2="180" stroke="#38bdf8" stroke-width="5" stroke-dasharray="8 6" opacity="0.8" />
    <line x1="170" y1="220" x2="342" y2="220" stroke="#38bdf8" stroke-width="5" stroke-dasharray="8 6" opacity="0.8" />
    <line x1="220" y1="256" x2="292" y2="256" stroke="#facc15" stroke-width="7" stroke-dasharray="6 4" opacity="0.9" />
    <line x1="170" y1="292" x2="342" y2="292" stroke="#e879f9" stroke-width="5" stroke-dasharray="8 6" opacity="0.8" />
    <line x1="160" y1="332" x2="352" y2="332" stroke="#e879f9" stroke-width="5" stroke-dasharray="8 6" opacity="0.8" />
    <line x1="180" y1="372" x2="332" y2="372" stroke="#e879f9" stroke-width="5" stroke-dasharray="8 6" opacity="0.8" />

    <!-- Strand 1 (Cyan) -->
    <path d="M 180,100 C 130,160 130,220 200,256 C 270,292 370,330 332,412"
          fill="none" stroke="url(#cyan-grad)" stroke-width="12" stroke-linecap="round" />

    <!-- Strand 2 (Purple) -->
    <path d="M 332,100 C 382,160 382,220 312,256 C 242,292 142,330 180,412"
          fill="none" stroke="url(#purple-grad)" stroke-width="12" stroke-linecap="round" />

    <!-- Nucleotide nodes -->
    <circle cx="180" cy="100" r="10" fill="#22d3ee" />
    <circle cx="332" cy="100" r="10" fill="#e879f9" />
    <circle cx="140" cy="170" r="10" fill="#38bdf8" />
    <circle cx="372" cy="170" r="10" fill="#c084fc" />
    <circle cx="200" cy="256" r="11" fill="#0284c7" />
    <circle cx="312" cy="256" r="11" fill="#a855f7" />
    <circle cx="350" cy="340" r="10" fill="#38bdf8" />
    <circle cx="162" cy="340" r="10" fill="#c084fc" />
    <circle cx="332" cy="412" r="10" fill="#0ea5e9" />
    <circle cx="180" cy="412" r="10" fill="#a855f7" />
  </g>

  <!-- Cas9 Molecular Scissors / Guide Spark at Cleavage Site (Center) -->
  <g transform="translate(256, 256)" filter="url(#glow)">
    <!-- Glowing cleavage flash -->
    <circle cx="0" cy="0" r="18" fill="#facc15" opacity="0.9" />
    <circle cx="0" cy="0" r="32" fill="#facc15" opacity="0.3" />
    
    <!-- Spark rays -->
    <line x1="-28" y1="0" x2="28" y2="0" stroke="#fef08a" stroke-width="4" stroke-linecap="round" />
    <line x1="0" y1="-28" x2="0" y2="28" stroke="#fef08a" stroke-width="4" stroke-linecap="round" />
    <line x1="-18" y1="-18" x2="18" y2="18" stroke="#facc15" stroke-width="3" stroke-linecap="round" />
    <line x1="-18" y1="18" x2="18" y2="-18" stroke="#facc15" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- CRISPR Label / Subtitle -->
  <text x="256" y="468" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="34" letter-spacing="6" fill="#e2e8f0">CRISPR</text>
  <text x="256" y="488" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="14" letter-spacing="3" fill="#38bdf8">CAS9</text>
</svg>
